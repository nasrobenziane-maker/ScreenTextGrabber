name: Build ScreenTextGrabber

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: dotnet publish ScreenTextGrabber.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTextGrabber-exe
          path: out/ScreenTextGrabber.exe
